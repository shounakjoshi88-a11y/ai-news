<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Wire</title>
    <meta
      name="description"
      content="An automated wire of current AI news, models, code and research. Rebuilt every hour."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171a1f" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171a1f'/%3E%3Crect x='8' y='6' width='2' height='20' fill='%23e8ebef'/%3E%3Crect x='14' y='9' width='11' height='2' fill='%23e8ebef'/%3E%3Crect x='14' y='15' width='8' height='2' fill='%23808a96'/%3E%3Crect x='14' y='21' width='11' height='2' fill='%236fb4de'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#feed">Skip to dispatches</a>

    <header class="masthead">
      <div class="masthead__line">
        <h1 class="masthead__name">AI Wire</h1>
        <p class="status" id="status">
          <span class="status__dot" aria-hidden="true"></span>
          <span class="status__text">Connecting</span>
        </p>
      </div>
      <p class="masthead__note" id="note"></p>
      <p class="alert" id="alert" role="alert" hidden></p>
    </header>

    <div class="filters" id="filters" role="group" aria-label="Filter by source"></div>

    <main id="feed" tabindex="-1">
      <ol class="tape" id="tape" role="list"></ol>
      <div class="state" id="state" hidden></div>
    </main>

    <footer class="foot">
      <p>
        Assembled hourly from Hacker News, Hugging Face, GitHub and arXiv.
        <a href="https://github.com/shounakjoshi88-a11y/ai-news">Source on GitHub</a>
      </p>
    </footer>

    <p class="sr-only" id="announcer" aria-live="polite"></p>

    <noscript>
      <p class="state state--static">
        This wire is assembled in the browser from a file the build writes each hour, so it
        needs JavaScript enabled.
      </p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>

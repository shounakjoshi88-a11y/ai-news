name: Refresh dispatches

# Rebuilds data/news.json every hour, commits it, and publishes the page. The page
# itself is static, so this is the only moving part: no server, no database, no
# client-side API key.

on:
  schedule:
    # Hourly, at :07 past. GitHub starts scheduled runs a few minutes late under
    # load, and the page does not depend on the exact minute.
    - cron: "7 * * * *"
  # Code changes re-run the pipeline immediately. Data commits touch
  # data/news.json alone, so they never re-trigger this workflow.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

# Never let two refreshes race for the same file.
concurrency:
  group: refresh-dispatches
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild the data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step on purpose: the collector is zero-dependency and Node 20
      # already ships fetch, so there is no lockfile and nothing to cache.
      - name: Collect dispatches
        env:
          # Raises the GitHub search rate limit from 60 to 5000 requests an hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-news.mjs --out data/news.json

      # Skipped when collection failed: if every source is down the step above
      # exits 1, so the last good data stays live and unchanged.
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No change since the last run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "data: refresh dispatches ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin HEAD:main

  publish:
    name: Publish the page
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # main, not the triggering commit: the refresh job may have just pushed data.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      # Only the four files the page needs plus its data, so the published site
      # never carries the repo's docs, scripts or git metadata.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

name: Refresh dispatches

# Rebuilds data/news.json every hour and commits it. Vercel is linked to this
# repository, so that commit is itself what republishes the site — there is no
# deploy step here, and the job holds no hosting credential.

on:
  schedule:
    # Two entries, not one, on purpose. GitHub's scheduler is explicitly
    # best-effort — it starts runs late under load and sometimes drops them — and
    # this job is the only thing keeping the site current. If the :07 run is
    # dropped the :37 run picks the hour up.
    #
    # Both cannot be useful in the same hour, because the collector exits without
    # writing when data/news.json is under 50 minutes old. So the cost of the
    # spare entry is a few seconds of runner time, not a doubled commit history.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  # Code changes re-run the collector immediately. Data commits touch
  # data/news.json alone, so they never re-trigger this workflow.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

# Never let two refreshes race for the same file.
concurrency:
  group: refresh-dispatches
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild the data
    runs-on: ubuntu-latest
    # Fifteen minutes of slack over the collector's worst case. The optional
    # artwork step paces itself to its generator's per-IP limit (one image per
    # 45s) and is the only reason this needs to be generous.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # TEMPORARY diagnostic, removed in the commit that acts on its answer:
      # measures what this runner's IP can actually reach. Delete with
      # scripts/probe-feeds.mjs.
      - name: Probe feed reachability from this runner
        continue-on-error: true
        run: node scripts/probe-feeds.mjs

      # No install step on purpose: the collector is zero-dependency and Node 20
      # already ships fetch, so there is no lockfile and nothing to cache.
      - name: Collect dispatches
        env:
          # Raises the GitHub search rate limit from 60 to 5000 requests an hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A scheduled run yields to one that already refreshed the hour; a push
          # or a manual run means the code changed, so it always rebuilds.
          FORCE: ${{ github.event_name != 'schedule' }}
        run: node scripts/fetch-news.mjs --out data/news.json

      # Off unless someone deliberately turns it on. Two measured reasons, both
      # in the README's "Pictures, and why they are not generated" section: the
      # free generator stamps its own mark on every image, and given a headline
      # with no visual subject — which is exactly what the bare cards are; arXiv
      # titles, Show HN posts — it answers with an unrelated portrait, which on a
      # news page reads as a claim about who the story is about.
      #
      # Set the repository variable ARTWORK_MAX to a non-zero number to enable
      # it. `continue-on-error` stays regardless: if it ever does run, a rate
      # limit must cost pictures, never news.
      - name: Generate artwork for the cards without a picture
        if: ${{ vars.ARTWORK_MAX != '' && vars.ARTWORK_MAX != '0' }}
        continue-on-error: true
        env:
          ARTWORK_MAX: ${{ vars.ARTWORK_MAX }}
          ARTWORK_BUDGET_MS: "900000"
        run: node scripts/generate-artwork.mjs

      # Skipped when collection failed: if every source is down the step above
      # exits 1, so the last good data stays live and unchanged.
      - name: Commit if the data changed
        run: |
          # `images/` does not exist at all while generation is off, and may not
          # exist on a run where it failed before writing anything; a bare
          # `git add images` would fail the step and cost the hour's news.
          git add -- data/news.json
          if [ -d images ]; then git add -- images; fi

          if git diff --cached --quiet; then
            echo "No change since the last run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changed=$(git diff --cached --name-only | wc -l)
          git commit -m "data: refresh dispatches ($(date -u +'%Y-%m-%d %H:%M UTC'), $changed files)"

          # main can move while this job is collecting (someone pushes a fix).
          # Replay on top of whatever landed rather than failing the run.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
